name: Reconcile original UCI source
on: workflow_dispatch
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python retail/download.py
      - run: python retail/analyze_retail.py 'retail/source/Online Retail.xlsx'
      - run: git diff --exit-code -- retail/output/report.json retail/output/dashboard.html
